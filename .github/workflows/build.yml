name: Ndërto app-in

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalo paketat
        run: npm install --no-audit --no-fund
      - name: Krijo projektin Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1f7a5a' --iconBackgroundColorDark '#1f7a5a' --splashBackgroundColor '#121817' --splashBackgroundColorDark '#121817' || echo 'ikona standarde'
          npx cap sync android
      - name: Ndërto APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Orari-i-Punes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Orari-i-Punes.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalo paketat
        run: npm install --no-audit --no-fund
      - name: Ndërto EXE
        run: npm run win
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/Orari-i-Punes-Setup.exe

  publiko:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Vendos file-at te Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Orari i Punës
          body: "Android: Orari-i-Punes.apk · Windows: Orari-i-Punes-Setup.exe"
          make_latest: true
          files: |
            out/Orari-i-Punes.apk
            out/Orari-i-Punes-Setup.exe
